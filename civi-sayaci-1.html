<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Çivi Sayacı</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 10px 0 4px;
    color: #f0a500;
  }
  .subtitle {
    color: #9aa5b1;
    font-size: 0.85rem;
    margin-bottom: 20px;
    text-align: center;
  }
  .counter-box {
    background: rgba(255,255,255,0.05);
    border: 2px solid #f0a500;
    border-radius: 24px;
    padding: 30px 50px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(240,165,0,0.15);
    transition: transform 0.1s;
  }
  .counter-box.pulse { transform: scale(1.08); }
  #count {
    font-size: 5rem;
    font-weight: 800;
    color: #fff;
    line-height: 1;
  }
  .label { color: #9aa5b1; font-size: 0.9rem; margin-top: 6px; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 0.9rem;
    color: #9aa5b1;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #555;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .dot.active {
    background: #2ecc71;
    box-shadow: 0 0 10px #2ecc71;
  }

  .meter-wrap {
    width: 100%;
    max-width: 320px;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  #meter {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2ecc71, #f0a500, #e74c3c);
    transition: width 0.05s linear;
  }

  button {
    border: none;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .main-btn {
    width: 100%;
    max-width: 320px;
    padding: 18px;
    font-size: 1.1rem;
    background: #f0a500;
    color: #1a1a2e;
    margin-bottom: 14px;
  }
  .main-btn.listening { background: #e74c3c; color: #fff; }

  .row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 14px;
  }
  .row button {
    flex: 1;
    padding: 16px;
    font-size: 1.4rem;
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .row button:active { background: rgba(255,255,255,0.18); }

  .reset-btn {
    width: 100%;
    max-width: 320px;
    padding: 12px;
    font-size: 0.9rem;
    background: transparent;
    color: #e74c3c;
    border: 1px solid #e74c3c;
  }

  .settings {
    width: 100%;
    max-width: 320px;
    margin-top: 20px;
    padding: 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
  }
  .settings label {
    font-size: 0.8rem;
    color: #9aa5b1;
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  input[type=range] { width: 100%; }

  .hint {
    margin-top: 16px;
    font-size: 0.78rem;
    color: #6b7787;
    text-align: center;
    max-width: 320px;
    line-height: 1.4;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 4/3;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    background: #000;
    border: 2px solid rgba(255,255,255,0.1);
    display: none;
  }
  .video-wrap.show { display: block; }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .flash {
    position: absolute;
    inset: 0;
    background: #2ecc71;
    opacity: 0;
    pointer-events: none;
  }
  .flash.go {
    animation: flashAnim 0.35s ease-out;
  }
  @keyframes flashAnim {
    0% { opacity: 0.75; }
    100% { opacity: 0; }
  }
  .video-count-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-weight: 700;
    font-size: 1.4rem;
    padding: 4px 12px;
    border-radius: 10px;
  }
  .camera-toggle {
    width: 100%;
    max-width: 320px;
    padding: 12px;
    font-size: 0.9rem;
    background: rgba(255,255,255,0.08);
    color: #fff;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<h1>🔩 Çivi Sayacı</h1>
<div class="subtitle">Kutuya düşen çivilerin sesini dinleyip otomatik sayar</div>

<div id="diagBanner" style="display:none; width:100%; max-width:320px; background:rgba(231,76,60,0.15); border:1px solid #e74c3c; color:#ffb3a7; padding:10px 14px; border-radius:12px; font-size:0.8rem; margin-bottom:14px; line-height:1.4;"></div>

<div class="counter-box" id="counterBox">
  <div id="count">0</div>
  <div class="label">çivi</div>
</div>

<div class="status">
  <div class="dot" id="dot"></div>
  <span id="statusText">Dinleme kapalı</span>
</div>

<div class="meter-wrap"><div id="meter"></div></div>

<button class="camera-toggle" id="cameraBtn">📷 Kamerayı Aç</button>

<div class="video-wrap" id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <div class="flash" id="flash"></div>
  <div class="video-count-badge" id="videoBadge">0</div>
</div>

<button class="main-btn" id="listenBtn">🎤 Dinlemeyi Başlat</button>

<div class="row">
  <button id="minusBtn">−1</button>
  <button id="plusBtn">+1</button>
</div>

<button class="reset-btn" id="resetBtn">Sıfırla</button>

<div class="settings">
  <label>Hassasiyet (eşik) <span id="threshVal">28</span></label>
  <input type="range" id="threshSlider" min="5" max="80" value="28">
  <label style="margin-top:10px;">Algılama aralığı (ms) <span id="cooldownVal">250</span></label>
  <input type="range" id="cooldownSlider" min="100" max="800" value="250" step="10">
</div>

<div class="hint">
  Ses çok hassas sayıyorsa hassasiyet değerini yükselt. Çivi seslerini kaçırıyorsa düşür.
  Yanlış sayımları +1 / −1 ile elle düzeltebilirsin.
</div>

<script>
let count = 0;
let listening = false;
let audioCtx, analyser, micStream, dataArray, rafId;
let lastTriggerTime = 0;
let threshold = 28;
let cooldown = 250;

const countEl = document.getElementById('count');
const counterBox = document.getElementById('counterBox');
const listenBtn = document.getElementById('listenBtn');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const meter = document.getElementById('meter');
const threshSlider = document.getElementById('threshSlider');
const threshVal = document.getElementById('threshVal');
const cooldownSlider = document.getElementById('cooldownSlider');
const cooldownVal = document.getElementById('cooldownVal');
const cameraBtn = document.getElementById('cameraBtn');
const videoWrap = document.getElementById('videoWrap');
const video = document.getElementById('video');
const flash = document.getElementById('flash');
const videoBadge = document.getElementById('videoBadge');
const diagBanner = document.getElementById('diagBanner');

function showDiag(msg) {
  diagBanner.textContent = msg;
  diagBanner.style.display = 'block';
}
function clearDiag() {
  diagBanner.style.display = 'none';
}

// Run an early environment check so failures are never silent
window.addEventListener('DOMContentLoaded', () => {
  if (!window.isSecureContext) {
    showDiag('⚠️ Bu sayfa güvenli (https) bağlantı üzerinden açılmamış. Mikrofon/kamera tarayıcı tarafından tamamen engelleniyor. Sayfayı sohbet içindeki önizlemeden "yeni sekmede aç" ile açmayı dene.');
  } else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showDiag('⚠️ Bu ortam mikrofon/kamera API’sini desteklemiyor (muhtemelen kısıtlı bir önizleme penceresi). Sayfayı ayrı bir sekmede/tarayıcıda açmayı dene.');
  }
});

let cameraOn = false;
let camStream = null;

async function toggleCamera() {
  if (cameraOn) {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    videoWrap.classList.remove('show');
    cameraBtn.textContent = '📷 Kamerayı Aç';
    cameraOn = false;
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = camStream;
    videoWrap.classList.add('show');
    cameraBtn.textContent = '📷 Kamerayı Kapat';
    cameraOn = true;
  } catch (err) {
    showDiag('📷 Kameraya erişilemedi: ' + err.message + '. İzinleri kontrol et veya sayfayı ayrı sekmede aç.');
  }
}

cameraBtn.addEventListener('click', toggleCamera);

threshSlider.addEventListener('input', () => {
  threshold = parseInt(threshSlider.value);
  threshVal.textContent = threshold;
});
cooldownSlider.addEventListener('input', () => {
  cooldown = parseInt(cooldownSlider.value);
  cooldownVal.textContent = cooldown;
});

function updateCount(delta) {
  count = Math.max(0, count + delta);
  countEl.textContent = count;
  videoBadge.textContent = count;
  counterBox.classList.add('pulse');
  setTimeout(() => counterBox.classList.remove('pulse'), 100);
  if (delta > 0) {
    flash.classList.remove('go');
    void flash.offsetWidth; // restart animation
    flash.classList.add('go');
  }
  if (navigator.vibrate) navigator.vibrate(40);
}

document.getElementById('plusBtn').addEventListener('click', () => updateCount(1));
document.getElementById('minusBtn').addEventListener('click', () => updateCount(-1));
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Sayacı sıfırlamak istediğine emin misin?')) {
    count = 0;
    countEl.textContent = 0;
    videoBadge.textContent = 0;
  }
});

async function startListening() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.2;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    listening = true;
    listenBtn.textContent = '⏹ Dinlemeyi Durdur';
    listenBtn.classList.add('listening');
    dot.classList.add('active');
    statusText.textContent = 'Dinleniyor...';

    detectLoop();
  } catch (err) {
    showDiag('🎤 Mikrofona erişilemedi: ' + err.message + '. İzinleri kontrol et veya sayfayı ayrı sekmede aç.');
  }
}

function startListeningSafe() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    showDiag('⚠️ Bu ortamda mikrofon desteklenmiyor (https gerekli). Sayfayı ayrı bir sekmede açmayı dene.');
    return;
  }
  clearDiag();
  startListening();
}

function stopListening() {
  listening = false;
  if (rafId) cancelAnimationFrame(rafId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  listenBtn.textContent = '🎤 Dinlemeyi Başlat';
  listenBtn.classList.remove('listening');
  dot.classList.remove('active');
  statusText.textContent = 'Dinleme kapalı';
  meter.style.width = '0%';
}

function detectLoop() {
  if (!listening) return;
  analyser.getByteTimeDomainData(dataArray);

  // calculate volume as deviation from center (128)
  let sumSquares = 0;
  let peak = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const dev = Math.abs(dataArray[i] - 128);
    sumSquares += dev * dev;
    if (dev > peak) peak = dev;
  }
  const rms = Math.sqrt(sumSquares / dataArray.length);
  const level = Math.min(100, (peak / 128) * 100);
  meter.style.width = level + '%';

  const now = Date.now();
  if (peak > threshold && (now - lastTriggerTime) > cooldown) {
    lastTriggerTime = now;
    updateCount(1);
  }

  rafId = requestAnimationFrame(detectLoop);
}

listenBtn.addEventListener('click', () => {
  if (listening) {
    stopListening();
  } else {
    startListeningSafe();
  }
});
</script>
</body>
</html>
