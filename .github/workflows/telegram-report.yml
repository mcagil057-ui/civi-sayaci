# Çivi Sayacı — Telegram günlük rapor (hasat + rapor mimarisi)
#
# Eski tasarım gece 00:00'da ntfy'den veri okuyordu; ntfy mesajları yalnızca
# ~12 saat saklandığı ve GitHub zamanlanmış görevleri bazen saatlerce
# geciktirdiği için veri sık sık kaçıyordu ("veri yok, atlanıyor").
#
# Yeni tasarım: görev gün içinde ~2 saatte bir çalışır, telefonun ntfy'ye
# yazdığı son durumu depodaki KALICI dosyaya (data/stats.json) biriktirir
# (hasat). Gece yarısından sonraki ilk çalışma, raporu bu kalıcı dosyadan
# üretip gönderir — görev ne kadar gecikirse geciksin veri kaybolmaz.
#
# Gerekli gizli anahtarlar (repo Settings → Secrets and variables → Actions):
#   TELEGRAM_TOKEN   → BotFather'ın verdiği bot token
#   TELEGRAM_CHAT_ID → @userinfobot'un söylediği Id
#   RAPOR_KODU       → Sitedeki "Notlar" sekmesinde görünen Rapor Kodu
name: Telegram Gunluk Rapor

on:
  schedule:
    # 06:13–22:13 UTC arası 2 saatte bir hasat; 21:13 UTC = 00:13 TR
    # civarındaki çalışma gece raporunu gönderir. Gecikse bile sonraki
    # herhangi bir çalışma raporu telafi eder (veri kalıcı dosyada).
    - cron: '13 6,8,10,12,14,16,18,20,21,22 * * *'
  workflow_dispatch:
    inputs:
      hedef_gun:
        description: "Hangi gunun raporu? (test icin 'bugun' sec)"
        type: choice
        default: otomatik
        options: [otomatik, dun, bugun]

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Veri hasadi ve rapor
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ secrets.RAPOR_KODU }}
          HEDEF_GUN: ${{ github.event.inputs.hedef_gun }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ] || [ -z "${TOPIC:-}" ]; then
            echo "Eksik secret: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID ve RAPOR_KODU tanimlanmali."
            exit 1
          fi

          mkdir -p data
          [ -s data/stats.json ] || echo '{"days":{},"sent":[],"weekSent":[]}' > data/stats.json
          STATS=$(cat data/stats.json)

          # ---------- 1) HASAT: telefonun son durumunu kalici dosyaya isle ----------
          RAW=$(curl -s "https://ntfy.sh/${TOPIC}/json?poll=1&since=12h" || true)
          SNAP=$(printf '%s\n' "$RAW" | jq -c 'select(.message != null) | (.message | fromjson?) | select(.days != null)' 2>/dev/null | tail -n 1 || true)
          if [ -n "$SNAP" ]; then
            STATS=$(jq -cn --argjson s "$STATS" --argjson n "$SNAP" '
              $s
              | .days     = ((.days // {}) + ($n.days // {}))
              | .sent     = (((.sent // []) + ($n.sent // [])) | unique)
              | .rate     = (if ($n.rate // 0) > 0 then $n.rate else (.rate // 0) end)
              | .rateUnit = ($n.rateUnit // .rateUnit // "each")
              | .goal     = (if ($n.goal // 0) > 0 then $n.goal else (.goal // 0) end)')
            echo "Hasat: telefon verisi bulundu, kalici dosyaya islendi."
          else
            echo "Hasat: son 12 saatte yeni telefon verisi yok (onceki hasatlar kalici dosyada duruyor)."
          fi

          # ---------- 2) RAPOR ----------
          case "${HEDEF_GUN:-otomatik}" in
            bugun) DAY=$(TZ=Europe/Istanbul date +%F) ;;
            *)     DAY=$(TZ=Europe/Istanbul date -d yesterday +%F) ;;
          esac
          echo "Rapor gunu: $DAY"

          RATE=$(echo "$STATS" | jq -r '.rate // 0')
          RATEUNIT=$(echo "$STATS" | jq -r '.rateUnit // "each"')
          GOAL=$(echo "$STATS" | jq -r '.goal // 0')
          earn_line() { # $1=nails
            awk -v n="$1" -v r="$RATE" -v u="$RATEUNIT" 'BEGIN{
              if (r+0<=0) exit 1;
              e = (u=="per50") ? (n/50)*r : n*r;
              printf "%.2f", e;
            }'
          }

          ALREADY=$(echo "$STATS" | jq -r --arg d "$DAY" '(.sent // []) | index($d)')
          NAILS=$(echo "$STATS" | jq -r --arg d "$DAY" '.days[$d].nails // 0')

          if [ "$ALREADY" != "null" ]; then
            echo "Rapor: $DAY zaten gonderilmis, atlaniyor."
          elif [ "$NAILS" -eq 0 ]; then
            echo "Rapor: $DAY icin veri yok, atlaniyor."
          else
            WORKMS=$(echo "$STATS" | jq -r --arg d "$DAY" '.days[$d].workMs // 0')
            FIRST=$(echo "$STATS" | jq -r --arg d "$DAY" '.days[$d].firstTs // empty')
            LAST=$(echo "$STATS" | jq -r --arg d "$DAY" '.days[$d].lastTs // empty')
            BATCHES=$(echo "$STATS" | jq -r --arg d "$DAY" '.days[$d].batches // 0')

            MIN=$(( WORKMS / 60000 )); H=$(( MIN / 60 )); M=$(( MIN % 60 ))
            if [ "$H" -gt 0 ]; then WORKSTR="${H} saat ${M} dk"; else WORKSTR="${M} dk"; fi
            DATESTR=$(TZ=Europe/Istanbul date -d "$DAY" +%d.%m.%Y)

            MSG="🔩 Çivi Sayacı — Günlük Rapor (${DATESTR})"$'\n\n'
            MSG="${MSG}✅ Toplam çivi: ${NAILS}"$'\n'
            MSG="${MSG}⏱ Çalışma süresi: ${WORKSTR}"
            if [ -n "$FIRST" ] && [ -n "$LAST" ]; then
              FT=$(TZ=Europe/Istanbul date -d "@$(( FIRST / 1000 ))" +%H:%M)
              LT=$(TZ=Europe/Istanbul date -d "@$(( LAST / 1000 ))" +%H:%M)
              MSG="${MSG}"$'\n'"🕐 İlk çivi: ${FT} — Son çivi: ${LT}"
              if [ "$NAILS" -ge 2 ] && [ "$LAST" -gt "$FIRST" ]; then
                SPN=$(awk -v f="$FIRST" -v l="$LAST" -v n="$NAILS" 'BEGIN{printf "%.1f", (l-f)/1000/(n-1)}')
                PERMIN=$(awk -v f="$FIRST" -v l="$LAST" -v n="$NAILS" 'BEGIN{s=(l-f)/1000/(n-1); if (s>0) printf "%.1f", 60/s; else print "-"}')
                MSG="${MSG}"$'\n'"⚡ Ortalama hız: ${SPN} sn/çivi (${PERMIN} çivi/dk)"
              fi
            fi
            MSG="${MSG}"$'\n'"📦 Tamamlanan 50'lik tur: ${BATCHES}"
            if EARN=$(earn_line "$NAILS"); then
              MSG="${MSG}"$'\n'"💰 Kazanç: ₺${EARN}"
            fi
            if [ "${GOAL:-0}" -gt 0 ] 2>/dev/null; then
              if [ "$NAILS" -ge "$GOAL" ]; then
                MSG="${MSG}"$'\n'"🎯 Hedef: ${GOAL} — ✅ ulaşıldı"
              else
                MSG="${MSG}"$'\n'"🎯 Hedef: ${GOAL} — ${NAILS}/${GOAL} (kalan $(( GOAL - NAILS )))"
              fi
            fi

            curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MSG}" > /dev/null
            echo "Gunluk rapor Telegram'a gonderildi."
            STATS=$(echo "$STATS" | jq -c --arg d "$DAY" '.sent = (((.sent // []) + [$d]) | unique)')
            # Telefonun ayni raporu tekrar gondermemesi icin isaret birak.
            curl -s -d "{\"reportSent\":\"${DAY}\"}" "https://ntfy.sh/${TOPIC}" > /dev/null || true

            # ---------- Haftalik ozet (raporlanan gun Pazar ise) ----------
            DOW=$(TZ=Europe/Istanbul date -d "$DAY" +%u)
            WEEKID=$(TZ=Europe/Istanbul date -d "$DAY" +%G-W%V)
            WMARK=$(echo "$STATS" | jq -r --arg w "$WEEKID" '(.weekSent // []) | index($w)')
            if [ "$DOW" = "7" ] && [ "$WMARK" = "null" ]; then
              WT=0; WORKW=0; WLINES=""
              for i in 6 5 4 3 2 1 0; do
                WD=$(TZ=Europe/Istanbul date -d "$DAY - $i day" +%F)
                WN=$(echo "$STATS" | jq -r --arg d "$WD" '.days[$d].nails // 0')
                WWM=$(echo "$STATS" | jq -r --arg d "$WD" '.days[$d].workMs // 0')
                WT=$(( WT + WN )); WORKW=$(( WORKW + WWM ))
                WDOW=$(TZ=Europe/Istanbul date -d "$WD" +%u)
                case "$WDOW" in 1) DN=Pzt;; 2) DN=Sal;; 3) DN=Çar;; 4) DN=Per;; 5) DN=Cum;; 6) DN=Cmt;; 7) DN=Paz;; esac
                WLINES="${WLINES}"$'\n'"  ${DN} $(TZ=Europe/Istanbul date -d "$WD" +%d.%m): ${WN}"
              done
              WMIN=$(( WORKW / 60000 )); WH=$(( WMIN / 60 )); WM=$(( WMIN % 60 ))
              WMSG="📊 Çivi Sayacı — Haftalık Özet (${WEEKID})"$'\n\n'
              WMSG="${WMSG}✅ Haftalık toplam: ${WT} çivi"$'\n'
              WMSG="${WMSG}⏱ Toplam çalışma: ${WH} saat ${WM} dk"
              if WEARN=$(earn_line "$WT"); then
                WMSG="${WMSG}"$'\n'"💰 Haftalık kazanç: ₺${WEARN}"
              fi
              WMSG="${WMSG}"$'\n\n'"Günlük dağılım:${WLINES}"
              curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT}" \
                --data-urlencode "text=${WMSG}" > /dev/null && echo "Haftalik ozet gonderildi."
              STATS=$(echo "$STATS" | jq -c --arg w "$WEEKID" '.weekSent = (((.weekSent // []) + [$w]) | unique)')
            fi
          fi

          # ---------- 3) KALICI DOSYAYI KAYDET ----------
          # Son 40 gunu tut, eskileri temizle.
          STATS=$(echo "$STATS" | jq -c '.days = (.days | to_entries | sort_by(.key) | (if length > 40 then .[-40:] else . end) | from_entries)')
          echo "$STATS" | jq . > data/stats.json
          if ! git diff --quiet -- data/stats.json 2>/dev/null || [ -n "$(git status --porcelain data/stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stats.json
            git commit -m "Gunluk istatistik verisi guncellendi [otomatik hasat]" >/dev/null
            git pull --rebase origin main >/dev/null 2>&1 || true
            git push >/dev/null
            echo "Kalici veri dosyasi guncellendi."
          else
            echo "Veri degismedi, kayit atlandi."
          fi
